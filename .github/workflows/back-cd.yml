name: CD - ExtractionApi Deploy to Azure Container Apps

on:
  workflow_run:
    workflows: [ "CI - ExtractionApi" ]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/lhorcajada/rffm-api
  WORKING_DIRECTORY: ./Back/ExtractionApi
  RESOURCE_GROUP: CoachResources
  CONTAINER_APP_NAME: rffm-api

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push-ghcr:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      image_tag: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set commit SHA
        id: commit
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.commit.outputs.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          file: ${{ env.WORKING_DIRECTORY }}/src/RFFM.Host/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_CONFIGURATION=Release

  deploy-container-app:
    runs-on: ubuntu-latest
    needs: build-and-push-ghcr

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE_NAME }}:${{ needs.build-and-push-ghcr.outputs.image_tag }}

      - name: Output deployed image
        run: |
          echo "✅ Deployed image: ${{ env.IMAGE_NAME }}:${{ needs.build-and-push-ghcr.outputs.image_tag }}"

# NOTE:
# Repository secrets required (already set via `gh secret set`):
# - AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID: OIDC federated identity
#   (App registration "github-rffm-api-cd", federated credential trusts
#   repo:lhorcajada/RFFM:ref:refs/heads/main, Contributor role scoped to the
#   CoachResources resource group only)
# - GHCR_PAT: GitHub PAT with read:packages, used by the Container App itself
#   (via Terraform) to pull the private image - NOT used by this workflow
#
# Infrastructure (Container Apps Environment, Log Analytics, Container App) is
# provisioned separately via infra/terraform/ (see infra/terraform/README.md).
# This workflow only builds/pushes the image and updates the running revision.
