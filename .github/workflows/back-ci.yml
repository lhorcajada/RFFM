name: CI - ExtractionApi

on:
  push:
    branches: [ main ]
    paths:
      - 'Back/ExtractionApi/src/**'
      - 'Back/ExtractionApi/tests/**'
      - 'Back/ExtractionApi/*.props'
      - 'Back/ExtractionApi/Dockerfile'
      - '.github/workflows/back-ci.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  WORKING_DIRECTORY: ./Back/ExtractionApi

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet restore RFFMExtraction.sln

      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet build RFFMExtraction.sln --configuration Release --no-restore

      - name: Run tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dotnet test RFFMExtraction.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.WORKING_DIRECTORY }}/**/TestResults/*.trx
          if-no-files-found: ignore
