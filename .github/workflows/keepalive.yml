name: Keep API Alive

on:
  schedule:
    # Cada 3 minutos. Ajusta según el timeout de scale-to-zero de tu Container App.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # permite lanzarlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping liveness endpoint
        run: |
          URL="https://rffm-api.calmground-92cb0105.westeurope.azurecontainerapps.io/liveness"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL")
          echo "Liveness check -> HTTP $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "::warning::Liveness check falló con status $STATUS"
          fi
