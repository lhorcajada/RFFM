name: Keep API Alive

on:
  schedule:
    # Cada 3 minutos. Ajusta según el timeout de scale-to-zero de tu Container App.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # permite lanzarlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up and ping liveness endpoint
        run: |
          URL="https://rffm-api.calmground-92cb0105.westeurope.azurecontainerapps.io/liveness"
          for attempt in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "Intento $attempt -> HTTP $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "Servicio despierto."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::No se pudo despertar el servicio tras varios intentos (último status: $STATUS)"
