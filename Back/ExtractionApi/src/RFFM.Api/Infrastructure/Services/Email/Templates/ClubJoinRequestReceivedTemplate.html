<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Nueva solicitud de unión al club</title>
    <style>
      .btn {
        background-color: #ffffff; /* contraste alto */
        color: #1a73e8; /* color del texto en azul para contraste */
        padding: 12px 20px;
        text-decoration: none;
        border-radius: 6px;
        display: inline-block;
        border: 2px solid #1a73e8;
        font-weight: 700;
        text-transform: uppercase;
      }
      .wrapper { font-family: Arial, sans-serif; text-align:center; padding:30px; }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h1>Nueva solicitud de unión al club</h1>
      <p>Hola {{DirectorName}},</p>
      <p><strong>{{ApplicantAlias}}</strong> ha solicitado unirse a <strong>{{ClubName}}</strong> como entrenador.</p>
      <p>Por favor, inicia sesión en Futbol Base para revisar y aprobar o rechazar esta solicitud.</p>
    </div>
  </body>
</html>
