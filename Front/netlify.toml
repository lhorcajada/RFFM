[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  # IMPORTANT: Set these in Netlify UI (Site settings → Environment variables)
  # For production, use the full API URL (Azure Container Apps):
  # VITE_API_BASE_URL = "https://rffm-api.calmground-92cb0105.westeurope.azurecontainerapps.io/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
